name: stremio-compose

services:
  stremio-server:
    image: stremio/server:latest
    container_name: stremio-server
    restart: unless-stopped
    environment:
      - NO_CORS=1
      - CASTING_DISABLED=1
      - APP_PATH=/root/.stremio-server
    volumes:
      - ./data/stremio:/root/.stremio-server

  gateway:
    extends: { file: gateway/gateway.yml, service: gateway }
    container_name: stremio-gateway
    ports:
      - "127.0.0.1:11470:11470"
    environment:
      TAILNET_HOST: ${STREMIO_HOST:-stremio.invalid}
    depends_on:
      stremio-server:
        condition: service_started

  tailscale:
    extends: { file: gateway/gateway.yml, service: tailscale }
    container_name: stremio-tailscale
    environment:
      TS_HOSTNAME: ${TS_HOSTNAME:-stremio}
      # Stored node state can hold settings from earlier runs; --reset lets each boot's flag set win
      # instead of erroring out ("requires mentioning all non-default flags") and restart-looping.
      TS_EXTRA_ARGS: --reset
    volumes:
      # serve.json is tailnet-only, funnel.json public; the launcher picks one from PUBLIC_ACCESS,
      # and a bare `docker compose up` stays private.
      - ./gateway/${TS_SERVE_FILE:-serve.json}:/config/serve.json:ro

x-volume-roles:
  tailscale-socket: rebuilt
  gateway-caddy-data: rebuilt

volumes:
  tailscale-socket:
  gateway-caddy-data:
